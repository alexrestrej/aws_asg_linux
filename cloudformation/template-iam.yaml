AWSTemplateFormatVersion: 2010-09-09
Description: DMS vpc role

Parameters:
  pAppBucketName:
    Description: ARN Bucket for Application
    Type: String

  pPSKMSARN:
    Description: KMS ARN value in Parameter Store
    Type: String
  
  pCustomKMS:
    Description: Custom KMS for shared services
    Type: String

  pSecretManagerCertARN:
    Description: The ARN of the secret that contains the password of certificate's private key 
    Type: String

  pImportBase:
    Description: Name base for the resources of this stack
    Type: String

  # pSecretManagerADPasswARN:
  #   Description: The ARN of the secret that contains the password of AD domain
  #   Type: String

Conditions:

  enableCustomKMS:
    !Not [!Equals [!Ref pCustomKMS, ""] ]

  CreateSecretPolicy:
    !Not [!Equals [!Ref pSecretManagerCertARN, ""] ]

