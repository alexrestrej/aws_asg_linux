AWSTemplateFormatVersion: 2010-09-09
Description: 'This template deploys a CloudWatch / Alarms / SNS Topics'

Parameters:
  pAlarmAlias:
    Type: String
    MinLength: 1
    MaxLength: 255
  pAlertWrapperTopic:
    Type: String
    MinLength: 1
    MaxLength: 255
  pSNSAppTopicEmail:
    Type: String
    MinLength: 1
    MaxLength: 255
  pSNSDBATopicEmail:
    Type: String
    MinLength: 1
    MaxLength: 255
  pSNSInfraTopicEmail:
    Type: String
    MinLength: 1
    MaxLength: 255
  pSNSDBATopicEmailGioti:
    Type: String
    MinLength: 1
    MaxLength: 255
  pSNSDBATopicEmailMonit:
    Type: String
    MinLength: 1
    MaxLength: 255
  pSNSDBATopicEmailMonitCC:
    Type: String
    MinLength: 1
    MaxLength: 255
  pbucketName1:
    Type: String
    Description: Bucket Name 1
  pbucketName2:
    Type: String
    Description: Bucket Name 2
  pbucketName3:
    Type: String
    Description: Bucket Name 3
  pbucketName4:
    Type: String
    Description: Bucket Name 4
  pEnvironment:
    Description: mapping Enviroment name
    Type: String
  pPSKMS:
    Description: KMS ARN value in Parameter Store
    Type: String   

Conditions:
  CreatePdnResources: !Equals [!Ref pEnvironment, "pdn"]
  CreateQaResources: !Equals [!Ref pEnvironment, "qa"]
  CreateDevResources: !Equals [!Ref pEnvironment, "dev"]
  cIntermedio:
    Fn::Or:
      - Fn::Equals: [Ref: pEnvironment, "qa"] 
      - Fn::Equals: [Ref: pEnvironment, "dev"]
Resources:
### Topics
  rSNSInfraTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Join [ "-", [ !Ref pAlarmAlias, "Infra-SNS"]]
      KmsMasterKeyId: !Join ["", ["arn:aws:kms:",!Ref 'AWS::Region',":",!Ref 'AWS::AccountId',":key/{{resolve:ssm:", !Ref pPSKMS, "}}"]]
      Subscription:
      - Endpoint: !Ref "pSNSInfraTopicEmail"
        Protocol: email
      Tags:
        - Key: organization:clasificacion-confidencialidad
          Value: "restringida"
        - Key: organization:clasificacion-integridad
          Value: "impacto critico"
        - Key: organization:clasificacion-disponibilidad
          Value: "impacto critico"

  rSNSDBATopic:
    Type: AWS::SNS::Topic
    Condition: cIntermedio
    Properties:
      DisplayName: !Join [ "-", [ !Ref pAlarmAlias, "DBA-SNS"]]
      KmsMasterKeyId: !Join ["", ["arn:aws:kms:",!Ref 'AWS::Region',":",!Ref 'AWS::AccountId',":key/{{resolve:ssm:", !Ref pPSKMS, "}}"]]
      Subscription:
      - Endpoint: !Ref "pSNSDBATopicEmail"
        Protocol: email
      Tags:
        - Key: organization:clasificacion-confidencialidad
          Value: "restringida"
        - Key: organization:clasificacion-integridad
          Value: "impacto critico"
        - Key: organization:clasificacion-disponibilidad
          Value: "impacto critico"

  rSNSDBATopic2:
    Type: AWS::SNS::Topic
    Condition: CreatePdnResources
    Properties:
      DisplayName: !Join [ "-", [ !Ref pAlarmAlias, "DBA-SNS"]]
      KmsMasterKeyId: !Join ["", ["arn:aws:kms:",!Ref 'AWS::Region',":",!Ref 'AWS::AccountId',":key/{{resolve:ssm:", !Ref pPSKMS, "}}"]]
      Subscription:
      - Endpoint: !Ref "pSNSDBATopicEmail"
        Protocol: email
      - Endpoint: !Ref "pSNSDBATopicEmailGioti"
        Protocol: email
      - Endpoint: !Ref "pSNSDBATopicEmailMonit"
        Protocol: email
      - Endpoint: !Ref "pSNSDBATopicEmailMonitCC"
        Protocol: email
      Tags:
        - Key: organization:clasificacion-confidencialidad
          Value: "restringida"
        - Key: organization:clasificacion-integridad
          Value: "impacto critico"
        - Key: organization:clasificacion-disponibilidad
          Value: "impacto critico"

  rSNSAppTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Join [ "-", [ !Ref pAlarmAlias, "App-SNS"]]
      KmsMasterKeyId: !Join ["", ["arn:aws:kms:",!Ref 'AWS::Region',":",!Ref 'AWS::AccountId',":key/{{resolve:ssm:", !Ref pPSKMS, "}}"]]
      Subscription:
      - Endpoint: !Ref "pSNSAppTopicEmail"
        Protocol: email
      Tags:
        - Key: organization:clasificacion-confidencialidad
          Value: "restringida"
        - Key: organization:clasificacion-integridad
          Value: "impacto critico"
        - Key: organization:clasificacion-disponibilidad
          Value: "impacto critico"
### S3
  OpsEventRuleS3:
    Type: AWS::Events::Rule
    Properties:
      Description: S3-DeleteBucket-Alarm
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - s3.amazonaws.com
          eventName:
            - DeleteBucket
          requestParameters:
            bucketName: [ !Ref pbucketName1, !Ref pbucketName2, !Ref pbucketName3, !Ref pbucketName4 ]
      State: ENABLED

  rOpsEventRuleS3Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmActions:
      - Ref: rSNSInfraTopic
      AlarmDescription: !Join [ ": ", [ 'DCMCustom', !Ref pAlarmAlias, 'A S3 bucket was deleted in account' ]]
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: RuleName 
        Value: !Ref OpsEventRuleS3
      EvaluationPeriods: 1
      MetricName: TriggeredRules
      Namespace: AWS/Events
      Period: 60
      Statistic: Maximum
      Threshold: 1
      TreatMissingData: 'notBreaching'
  
  rAlarmDatabaseConnections:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join [ "-", [ !Ref pAlarmAlias, " DatabaseConnections_rds_greater" ] ]
      AlarmDescription: "Las conexiones a la base datos son mayor a 900"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
      - Name: DBInstanceIdentifier
        Value: !Join [ "-", [!Ref pAlarmAlias, "rds" ]]
      EvaluationPeriods: 2
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Statistic: Average
      Threshold: 900
      TreatMissingData: breaching
      AlarmActions: 
        - Ref: pAlertWrapperTopic
      TreatMissingData: notBreaching

  rAlarmDatabaseConnectionsrds:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join [ "-", [ !Ref pAlarmAlias, " DatabaseConnections_rds_less" ] ]
      AlarmDescription: "Las conexiones a la base datos son menor a 500"
      ComparisonOperator: LessThanOrEqualToThreshold
      Dimensions:
      - Name: DBInstanceIdentifier
        Value: !Join [ "-", [!Ref pAlarmAlias, "rds" ]]
      EvaluationPeriods: 2
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Statistic: Average
      Threshold: 500
      TreatMissingData: breaching
      AlarmActions: 
        - Ref: pAlertWrapperTopic
      TreatMissingData: notBreaching

