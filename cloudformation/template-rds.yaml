Outputs:

  Scheduler:
    Description: Tag de mantenimiento de la base de datos
    Value:
      Ref: pinstanceScheduler

  SSLCertificateRDS:
    Description: Identificador del certificado SSL/TLS
    Value:
      Ref: pSSLcertificate

  JDBCConnectionString:
    Description: JDBC connection string for the database
    Value:
      Fn::Join:
        - ''
        - - 'jdbc:'
          - Ref: pDataBase
          - '://'
          - Fn::GetAtt:
              - rDataBases
              - Endpoint.Address
          - ':'
          - Fn::GetAtt:
              - rDataBases
              - Endpoint.Port
          - /
          - Ref: pDBName