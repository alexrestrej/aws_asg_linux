AWSTemplateFormatVersion: 2010-09-09
Description: Template para el despliegue de recursos RDS.

Parameters: #Parametros que necesitan los recursos para poder ser desplegados
  pEnvironment:
    Description: Ambiente donde se despliega.
    Type: String

  pPSSGASG:
    Description: SG ALB.
    Type: String

  pSgT:
    Description: SG2 Transversal RDS.
    Type: String

  pEngineVersion:
    Description: Engine Version RDS.
    Type: String

  pRdsclassintance:
    Description: Class RDS Instance primary
    Type: String

  pRdsBucketName:
    Description: Buecket RDS
    Type: String

  pPSSGEC2:
    Description: Security Group EC2 APP
    Type: String

  psgDMS:
    Description: Security Group DMS
    Type: String

  pDataBase:
    Description: Motor de base de datos
    Type: String

  pDBName:
    Description: Nombre de la base de datos.
    Type: String

  pAllocatedStorage:
    Description: Tamano del almacenamiento en GB.
    Type: String

  pStorageType:
    Description: El tipo de almacenamiento asociado con esta instancia de base de datos
    Type: String

  pDBARole:
    Description: ARN Role for DBA
    Type: String

  pCoesRole:
    Description: ARN Role for COES
    Type: String

  pLicenseModel:
    Description: El modelo de licencia de la instancia de base de datos.
    Type: String
    Default: bring-your-own-license

  pSnapshotIdentifier:
    Description: Identificador de snapshot para restauracion.
    Type: String

  pCharacterSetName:
    Description: Character set of the RDS.
    Type: String

  pImportBase:
    Description: The base name of the imported objetcs
    Type: String

  pMaxAllocatedStorage:
    Description: Tamano maximo de almacenamiento en GB.
    Type: String

  pSGTrasnversal:
    Description: Grupo de seguridad con las reglas transversales para las RDS 2.
    Type: String

  pSSMDBSGTransversal:
    Description: Sg transversal para la ejecucion de Scripts Iniciales
    Type: AWS::SSM::Parameter::Value<String>
    Default: lz_DbSgTransversal

  #pSSMDBSGTransversal2:
  #  Description: Sg transversal para la ejecucion de Scripts Iniciales
  #  Type: AWS::SSM::Parameter::Value<String>
  #  Default: lz_Db2SgTransversal

  pIopsAprovicionados:
    Description: Iops Storage io1.
    Type: String

  pinstanceScheduler:
    Description: nombre de la instance de la base de datos scheduler
    Type: String

  pLogGroupName:
    Description: Path to log group
    Type: String
    MinLength: 1
    MaxLength: 100

  pFilters:
    Description: Filters for triggering lambda
    Type: String
    MinLength: 1
    MaxLength: 200

  pSSLcertificate:
    Type: String
    Description: Identificador del certificado SSL/TLS
    Default: rds-ca-rsa2048-g1

  pPythonVersion:
    Type: String
    Description: Python version for lambda.

Mappings:
  oracle:
    dev:
      BackupRetentionPeriod: 8
      Engine: "oracle-ee"

      MultiAZ: false
      DeletionProtection: false

      OptionGroup: "stackset-aws-addon-database-lb-YOUR_RESOURCE_ID-dbaoracleee19optiongroup-nilna9cjyb4t"
      port: "50200"
      PreferredMaintenanceWindow: Sun:07:30-Sun:08:30
      PreferredBackupWindow: "05:30-06:30"
      PerformanceInsightsRetentionPeriod: 7
      EnablePerformanceInsights: true

      EnableCloudwatchLogsExports:
        - trace
        - audit
        - alert
        - listener
    qa:
      BackupRetentionPeriod: 8
      Engine: "oracle-ee"

      MultiAZ: false
      DeletionProtection: false
      OptionGroup: "stackset-aws-addon-database-lb-YOUR_RESOURCE_ID-dbaoracleee19optiongroup-1bszczzfnb3d5"
      port: "50200"
      PreferredMaintenanceWindow: Sun:07:30-Sun:08:30
      PreferredBackupWindow: "05:30-06:30"

      PerformanceInsightsRetentionPeriod: 7
      EnablePerformanceInsights: true
      EnableCloudwatchLogsExports:
        - trace
        - audit
        - alert
        - listener
    pdn:
      BackupRetentionPeriod: 35
      Engine: "oracle-ee"

      MultiAZ: true
      DeletionProtection: true
      OptionGroup: "stackset-aws-addon-database-lb-YOUR_RESOURCE_ID-dbaoracleee19optiongroup-ifl9c7sm6cc7"
      port: "57916"
      PreferredMaintenanceWindow: Wed:08:00-Wed:08:30
      PreferredBackupWindow: "06:30-07:30"
      PerformanceInsightsRetentionPeriod: 7
      EnablePerformanceInsights: true

      EnableCloudwatchLogsExports:
        - trace
        - audit
        - alert
        - listener

Conditions:
  cEmptySnapshot:
    Fn::Equals: [ Ref: pSnapshotIdentifier, "none" ]
  envPdn:
    Fn::Equals: [ Ref: pEnvironment, "pdn" ]
  envDev:
    Fn::Equals: [ Ref: pEnvironment, "dev" ]
  envQa:
    Fn::Equals: [ Ref: pEnvironment, "qa" ]

  cTypeStorage:
    Fn::And:
      - Fn::Equals: [ Ref: pStorageType, "io1" ]
      - !Not [ !Equals  [ Ref: pIopsAprovicionados, " " ] ]

  cIngressEC2APP:
    Fn::And:
      - !Not [ !Equals [ Ref: pPSSGEC2, "" ] ]
      - !Not [ !Equals [ Ref: pPSSGEC2, nosnap ] ]

  csgdms:
    Fn::And:
      - !Not [ !Equals [ Ref: psgDMS, "" ] ]
      - !Not [ !Equals [ Ref: psgDMS, nosnap ] ]

Resources:
  #Segurtiy Group personalizado para la RDS
  rDBSecurityGroups:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupName:
        Fn::Join: [ "", [ Ref: pImportBase, "-sg-rds" ] ]
      GroupDescription: Grupo de securidad para la instancia de base de datos.
      VpcId:
        Fn::ImportValue: 'DefaultVPCId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          Description: "Acceso DG"
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: '{{resolve:ssm:YOUR_DEPLOYMENT_NETWORK_PARAMETER:1}}'
        - IpProtocol: tcp
          Description: "Acceso VPN (Citrix)"
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: '{{resolve:ssm:YOUR_REMOTE_ACCESS_NETWORK_PARAMETER:1}}'
        - IpProtocol: tcp
          Description: "Segmento VPN contingencia "
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: '{{resolve:ssm:YOUR_CONTINGENCY_NETWORK_PARAMETER:1}}'
        - IpProtocol: tcp
          Description: "Allow access from cloud administrator network"
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: '{{resolve:ssm:YOUR_ADMIN_NETWORK_PARAMETER_A:1}}'
        - IpProtocol: tcp
          Description: "Allow access from on-premises administrator network"
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: 'YOUR_NETWORK_CIDR'
        - IpProtocol: tcp
          Description: "Allow access from contingency administrator network"
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: '{{resolve:ssm:YOUR_ADMIN_NETWORK_PARAMETER_B:1}}'
        - IpProtocol: 6
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Allow tcp access to the RDS from security scanner
        - IpProtocol: 17
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Allow udp access to the RDS from security scanner
        - IpProtocol: 6
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Allow tcp access to the RDS from security scanner
        - IpProtocol: 17
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Allow udp access to the RDS from security scanner
        - IpProtocol: 6
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Acceso desde la LZ para la ingestion de base de datos
        - CidrIp: YOUR_NETWORK_CIDR
          Description: Acceso desde application monitoring service para las vistas de base de datos
          FromPort: 50200
          ToPort: 57916
          IpProtocol: tcp
        - CidrIp: YOUR_NETWORK_CIDR
          Description: Acceso desde YOUR_ORGANIZATION_DOMAIN para enmascarar Data
          FromPort: 50200
          ToPort: 57916
          IpProtocol: tcp
        - IpProtocol: 6
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Allow access from database client network
        - IpProtocol: 6
          FromPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          ToPort:
            Fn::FindInMap:
              - Ref: pDataBase
              - Ref: pEnvironment
              - port
          CidrIp: YOUR_NETWORK_CIDR
          Description: Allow access from database client network
        - IpProtocol: tcp
          FromPort: 50000 
          ToPort: 59999
          CidrIp: 'YOUR_NETWORK_CIDR'
          Description: Allow access from SIEM service
      Tags:
        - Key: Name
          Value:
            Fn::Join: [ "", [ Ref: pImportBase, "-sg-rds" ] ]

  rIngressSSISSecurityGroupDMS:
    Condition: csgdms
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: tcp
      FromPort:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port

      ToPort:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port

      SourceSecurityGroupId: !Ref psgDMS
      Description: "Allow access to the RDS from DMS"
      GroupId: !Ref rDBSecurityGroups

  rIngressSecurityGroupAPPEC2:
    Condition: cIngressEC2APP
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: tcp
      FromPort:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port
      ToPort:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port
      SourceSecurityGroupId: !Ref pPSSGEC2
      Description: "Allow access APP EC2 YOUR_PROJECT_NAME"
      GroupId: !Ref rDBSecurityGroups

  rIngressSecurityGroupTransversal:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      IpProtocol: tcp
      FromPort:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port
      ToPort:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port
      SourceSecurityGroupId: !Ref pSgT
      Description: "Allow database administration access"
      GroupId: !Ref rDBSecurityGroups

  rIAMRoleForRDS:
    Type: 'AWS::IAM::Role'
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/YOUR_GOVERNANCE_BOUNDARY_POLICY
      RoleName:
        Fn::Join: [ "-", [ Ref: 'AWS::StackName' , "role" ] ]
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - rds.amazonaws.com
                - monitoring.rds.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action:
                  - s3:GetObject
                  - s3:GetObjectAcl
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:PutObjectTagging
                  - s3:List
                  - s3:AbortMultipartUpload
                Resource:
                  - Fn::Sub: arn:aws:s3:::${pRdsBucketName}
                  - Fn::Sub: arn:aws:s3:::${pImportBase}-s3-rds
                Effect: Allow
          PolicyName:
            Fn::Join: [ "-", [ Ref: 'AWS::StackName' , "iam-policy" ] ]
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Action:
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                  - 'kms:ReEncrypt'
                  - 'kms:Encrypt'
                  - 'kms:GenerateDataKey'
                #                  - 'kms:*'
                Resource:
                  - Fn::Join: [ "",[ "arn:aws:kms:", Ref: 'AWS::Region' ,":", Ref: 'AWS::AccountId',":key/", Fn::Join: [ "", [ "{{resolve:ssm:", Ref: pImportBase, "-kms:1}}" ] ] ] ]
                Effect: Allow
          PolicyName:
            Fn::Join: [ "-", [ Ref: 'AWS::StackName' , "kms-policy" ] ]

