#              Bool:
#                aws:SecureTransport: 'false'

  rIAMManagedPolicyforS3BackupRestore:
    #DependsOn:
    #- rS3RDS
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Join [ "", [ !Ref 'AWS::StackName' , "_iam_managed_policy" ] ]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
            Resource:
              Fn::Sub: arn:aws:s3:::${pRdsBucketName}
          - Effect: Allow
            Action:
              - 's3:GetObjectMetaData'
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:ListMultipartUploadParts'
              - 's3:AbortMultipartUpload'
            Resource:
              !Join [ "", [ "arn:aws:s3:::", !Ref pRdsBucketName, "/*" ] ]
      # Roles:
      #   - 'YOUR_APP_CODE-YOUR_PROJECT_NAME-dev-rds-role'

  #Rol para monitoreo de la BD
  rEnhancedMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/YOUR_GOVERNANCE_BOUNDARY_POLICY
      RoleName:
        Fn::Join: [ "-", [ Ref: pImportBase, "RDSEnhancedMonitoringRoleApp" ] ]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ''
            Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Path: "/"

  #Recurso RDS Base de Datos Oracle
  rDataBases:
    Type: 'AWS::RDS::DBInstance'
    DependsOn: rParameterGroupParameterStore
    Properties:
      CACertificateIdentifier:
        Ref: pSSLcertificate
      EnableIAMDatabaseAuthentication: False
      CopyTagsToSnapshot: true
      DBName:
        Ref: pDBName
      DBInstanceIdentifier:
        Fn::Join: [ "-", [ Ref: pImportBase, "rds" ] ]
      VPCSecurityGroups:
        - Ref: rDBSecurityGroups
        - Ref: pSSMDBSGTransversal
        - Ref: pSGTrasnversal
      AllocatedStorage:
        Ref: pAllocatedStorage
      MaxAllocatedStorage:
        Ref: pMaxAllocatedStorage
      DBSnapshotIdentifier:
        Fn::If:
          - cEmptySnapshot
          - Ref: AWS::NoValue
          - Ref: pSnapshotIdentifier
      StorageType:
        Ref: pStorageType
      Iops:
        Fn::If:
          - cTypeStorage
          - Ref: pIopsAprovicionados
          - Ref: AWS::NoValue
      DBInstanceClass:
        Ref: pRdsclassintance
      Engine:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - Engine
      EngineVersion:
        Ref: pEngineVersion
      PerformanceInsightsRetentionPeriod:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - PerformanceInsightsRetentionPeriod
      EnablePerformanceInsights:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - EnablePerformanceInsights
      LicenseModel:
        Ref: pLicenseModel
      Port:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - port
      KmsKeyId:
        Fn::Join: [ "", [ "{{resolve:ssm:", Ref: pImportBase, "-kms}}" ] ]
      CharacterSetName:
        Ref: pCharacterSetName
      MultiAZ:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - MultiAZ
      EnableCloudwatchLogsExports:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - EnableCloudwatchLogsExports
      MasterUsername:
        Fn::Join: [ '', [ '{{resolve:secretsmanager:', Ref: rSecretAdminRDS, ':SecretString:username}}' ] ]
      MasterUserPassword:
        Fn::Join: [ '', [ '{{resolve:secretsmanager:', Ref: rSecretAdminRDS, ':SecretString:password}}' ] ]
      PreferredBackupWindow:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - PreferredBackupWindow
      DBParameterGroupName:
        Fn::Join: [ "", [ "{{resolve:ssm:", Ref: rParameterGroupParameterStore, ":1}}" ] ]
        #'{{resolve:ssm:rParameterGroupParameterStore:1}}'
        # Fn::FindInMap:
        # - Ref: pDataBase
        # - Ref: pEnvironment
        # - parameterGroup
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: true
      #EnablePerformanceInsights: true
      PreferredMaintenanceWindow:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - PreferredMaintenanceWindow
      DBSubnetGroupName:
        Fn::Sub: '${pEnvironment}-db-subnets2'
      OptionGroupName:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - OptionGroup
      DeletionProtection:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - DeletionProtection
      PubliclyAccessible: false
      DeleteAutomatedBackups: true
      BackupRetentionPeriod:
        Fn::FindInMap:
          - Ref: pDataBase
          - Ref: pEnvironment
          - BackupRetentionPeriod
      AssociatedRoles:
        - FeatureName: S3_INTEGRATION
          RoleArn:
            Fn::GetAtt: rIAMRoleForRDS.Arn
      MonitoringRoleArn: !GetAtt rEnhancedMonitoringRole.Arn
      MonitoringInterval: 60
      Tags:
        - Key: organization:clasificacion-confidencialidad
          Value: "restringida"
        - Key: organization:clasificacion-integridad
          Value: "impacto critico"
        - Key: organization:clasificacion-disponibilidad
          Value: "impacto critico"
        - Key: organization:dominio-informacion
          Value: "no"
        - Key: organization:datos-personales
          Value: "no"
        - Key: organization:cumplimiento
          Value: "bia"
        - Key: organization:bkmensual
          Value: "rds"
        - Key: organization:bkdiario
          Value: "rds"
        - Key: instance:scheduler
          Value: !Ref pinstanceScheduler
    DeletionPolicy: Snapshot


  rDBAOracleEE19ParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Parameter Group RDS YOUR_PROJECT_NAME
      Family: oracle-ee-19
      Parameters:
        audit_trail: XML,EXTENDED
        _trace_files_public: FALSE
        db_writer_processes: 1
        job_queue_processes: 4000
        resource_manager_cpu_allocation: 8
        sec_max_failed_login_attempts: 10
        undo_retention: 129600
        db_block_checking: FALSE
        dml_locks: 9996
        parallel_max_servers: 320
        parallel_min_servers: 0
        parallel_servers_target: 128
        pre_page_sga: FALSE
      Tags:
        - Key: Name
          Value: !Join [ "", [ !Ref 'AWS::StackName' ,"OracleEE19", "-parametergroup" ] ]

  rSecretAdminRDS:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${pImportBase}-secretrds-admind'
      Description:
        Fn::Sub: 'Secreto del usuario administrador de la base de datos ${pImportBase}.'
      KmsKeyId: '{{resolve:ssm:YOUR_RDS_ADMIN_KMS_PARAMETER}}'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "YOUR_DATABASE_ADMIN_USER"}'
        GenerateStringKey: "password"
        PasswordLength: 15
        ExcludeCharacters: '"@/\'

  rSecretAdminRDSResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    DependsOn: rSecretAdminRDS
    Properties:
      SecretId: !Ref rSecretAdminRDS
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: "Deny"
            Principal:
              AWS: "*"
            Action:
              - "secretsmanager:GetSecretValue"
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:PrincipalArn:
                  - !Join ["",["arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_CLOUDFORMATION_DEPLOYMENT_ROLE"]]
                  - !Join ["",["arn:aws:iam::", !Ref 'AWS::AccountId',":role/","BCO-SR-SecretCertificate-Operation"]]
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_CLOUDFORMATION_DEPLOYMENT_ROLE" ] ]
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":root" ] ]
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_DATABASE_OPERATIONS_ROLE" ] ]
                  - !Ref pDBARole
                  - !Ref pCoesRole

  rSecretAdminRDSInstanceAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId:
        Ref: rSecretAdminRDS
      TargetId:
        Ref: rDataBases
      TargetType: AWS::RDS::DBInstance

  rSQLScriptsLambdaFunctionCustomResoure:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken:
        Fn::Sub: 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:aw0000-cloud-lb-scripts-rds-function'
      SecretAdminRDS:
        Ref: rSecretAdminRDS
      DatabaseName:
        Ref: pDBName
    DependsOn: rSecretAdminRDSInstanceAttachment

  rParameterGroupParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Parameter Groups YOUR_PROJECT_NAME
      Type: String
      Name: !Join [ "-", [ !Ref 'AWS::StackName', "ParameterGroups" ] ]
      Value:
        !Ref rDBAOracleEE19ParameterGroup

  rInstanceRDSParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
      Description: DBInstanceIdentifier RDS
      Type: String
      Name:
        Fn::Join: [ "-", [ Ref: 'AWS::StackName', "ident" ] ]
      Value:
        Ref: rDataBases

  rSecurityGroupRDSParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Id security group RDS
      Type: String
      Name: !Join [ "-", [ !Ref 'AWS::StackName', "sg" ] ]
      Value:
        Ref: rDBSecurityGroups

  # SOC
  rLambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: envPdn
    Properties:
      RoleName: !Join [ "-", [ !Ref 'AWS::StackName', "LambdaExecutionRole" ] ]
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/YOUR_GOVERNANCE_BOUNDARY_POLICY
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                  - "logs:GetLogGroupFields"
                  - "logs:DescribeQueries"
                  - "logs:GetLogRecord"
                  - "logs:GetQueryResults"
                  - "logs:CreateLogGroup"
                  - "logs:PutLogEvents"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-stream:*"
              - Effect: Allow
                Action:
                  - "s3:Get"
                  - "s3:List"
                  - "s3:PutObject"
                  - "s3:GetObjectVersion"
                  - "s3:GetObjectACL"
                  - "s3:PutObjectACL"
                  - "s3:ObjectOwnerOverrideToBucketOwner"
                Resource: '*'

