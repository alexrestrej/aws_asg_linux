  rLambdaOraclenotify:
    Type: AWS::Lambda::Function
    Condition: envPdn
    Properties:
      FunctionName:
        Fn::Join: [ "-", [ Ref: pImportBase,"MonitoreoSOC", Ref: pDBName ] ]
      Role:
        Fn::GetAtt: rLambdaExecutionRole.Arn
      Runtime: !Ref pPythonVersion
      Timeout: 300
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: YOUR_PROJECT_CODE-arch-deploy-pdn-bucket
        S3Key: lambdas/python3.zip
      Tags:
        - Key: "organization:clasificacion-confidencialidad"
          Value: "na"
        - Key: "organization:clasificacion-integridad"
          Value: "na"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "na"

  rExecutePermission:
    Type: "AWS::Lambda::Permission"
    Condition: envPdn
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName:
        !GetAtt rLambdaOraclenotify.Arn
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${pLogGroupName}:*'

  rLambdaCWLogs:
    Type: AWS::Logs::SubscriptionFilter
    Condition: envPdn
    Properties:
      FilterPattern:
        Ref: pFilters
      LogGroupName:
        Ref: pLogGroupName
      DestinationArn:
        !GetAtt rLambdaOraclenotify.Arn
