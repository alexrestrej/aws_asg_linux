  #       QueryStringConfig:
  #         Values:
  #           - Key: "operation"
  #             Value: "retrieveClientInformation"       
  #     Priority: 1    

  rALBTargetGroupAppArnParameterStoreHTTPS:
    Type: AWS::SSM::Parameter
    Properties:
        Description: The ARN of ALB target group
        Type: String
        Name: !Join ["-", [!Ref 'AWS::StackName', "https-tg"]]
        Value:
            Ref: rALBTargetGroupAppHTTPS

  rALBFullNameParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
        Description: The full name of the load balancer
        Type: String
        Name: !Join ["-", [!Ref 'AWS::StackName', "full-name"]]
        Value:
            Fn::GetAtt: [rApplicationLoadBalancer, LoadBalancerFullName]


Outputs:
  rALBTargetGroupAppArnHTTPS:
    Description: The ARN of ALB target group
    Value:
      Ref: rALBTargetGroupAppHTTPS
  InternalCertificateELB01AcmArn01:
    Value: !GetAtt InternalCertificateELB01.AcmCerArn
  InternalCertificateELB01Cer01:
    Value: !GetAtt InternalCertificateELB01.Cer
  rNLBFullName:
      Description: The full name of the load balancer.
      Value:
        Fn::GetAtt: [rApplicationLoadBalancer, LoadBalancerFullName]