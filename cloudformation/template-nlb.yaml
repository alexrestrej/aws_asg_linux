AWSTemplateFormatVersion: 2010-09-09
Description: >-
  This Cloud Formation template deploy an ELB Load Balancer, with Target Group

Parameters:

  pASGSubnets:
    Description: Subnets for application load balancer
    Type: String

  pLoadBalancerTimeOut:
    Description: The Network Load Balancer timeout
    Type: String

  pSchemaNLB:
    Description: Tipo de NLB, Internal o internet-facing.
    Type: String

  pARNCertificado:
    Description: Arn del certificado
    Type: String

  pSslPolicy:
    Description: Indique la politica de seguridad a usar. (ELBSecurityPolicy-TLS-1-2-Ext-2018-06)
    Type: String

  pS3LogsALB:
    Type: String
    Description: The S3 bucket name that contains ALB logs.

  ## Parametros PKI - Certificados Digitales
  pCerPkiArn:
    Description: The ARN of the SNS topic used to request a PKI Certificate.
    Type: String

  ## Parametros Certificados
  pCerCommonName01:
    Description: Common Name for Certificate 01.
    Type: String

  pCerSans01:
    Description: SANS for Certificate 01.
    Type: String

Resources:

## Certificado Digital 01 - InternalDigitalCertificate

  InternalCertificateELB01:
    Type: Custom::InternalDigitalCertificate
    Properties:
      ServiceToken: !Ref pCerPkiArn
      common_name: !Ref pCerCommonName01
      subject_alternative_names: !Ref pCerSans01
      aws_service: 'ELB'
      key_type: RSA2048

  rNetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref 'AWS::StackName'
      Scheme: !Ref pSchemaNLB
      Type: network
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: true
        - Key: access_logs.s3.bucket
          Value: !Ref pS3LogsALB
        - Key: access_logs.s3.prefix
          Value: "NLBLogs"
        - Key: deletion_protection.enabled
          Value: false
        - Key: load_balancing.cross_zone.enabled
          Value: true

      Subnets:
        Fn::Split:
          - ','
          - Ref: pASGSubnets

  rNLBTargetGroupAppTLS:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 5
      TargetType: instance
      Port: 8443
      Protocol: TLS
      VpcId:
        Fn::ImportValue: DefaultVPCId
      Tags:
      - Key: Name
        Value:  !Join ["-", [!Ref 'AWS::StackName', "tg"]]

  rNLBListenerAppTLS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref rNetworkLoadBalancer
      Port: 8443
      Protocol: TLS
      Certificates:
      - CertificateArn: !GetAtt InternalCertificateELB01.AcmCerArn
      SslPolicy: ELBSecurityPolicy-FS-1-2-Res-2020-10
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref rNLBTargetGroupAppTLS

  rNLBTargetGroupAppTCP:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 5
      TargetType: instance
      Port: 8080
      Protocol: TCP
      VpcId:
        Fn::ImportValue: DefaultVPCId
      Tags:
      - Key: Name
        Value:  !Join ["-", [!Ref 'AWS::StackName', "tg-tcp"]]

  rNLBListenerAppTCP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref rNetworkLoadBalancer
      Port: 8080
      Protocol: TCP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref rNLBTargetGroupAppTCP


  rNLBTargetGroupAppArnParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
        Description: The ARN of Encuenta NLB target group
        Type: String
        Name: !Join ["-", [!Ref 'AWS::StackName', "tls-tg"]]
        Value:
            Ref: rNLBTargetGroupAppTLS

  rNLBTargetGroupAppArnParameterStore2:
    Type: AWS::SSM::Parameter
    Properties:
        Description: The ARN of Encuenta NLB target group TCP
        Type: String
        Name: !Join ["-", [!Ref 'AWS::StackName', "tcp-tg"]]
        Value:
            Ref: rNLBTargetGroupAppTCP

  rNLBFullNameParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
        Description: The full name of the load balancer
        Type: String
        Name: !Join ["-", [!Ref 'AWS::StackName', "full-name"]]
        Value:
            Fn::GetAtt: [rNetworkLoadBalancer, LoadBalancerFullName]

Outputs:
    rNLBTargetGroupAppArn:
      Description: The ARN of Encuenta NLB target group
      Value:
        Ref: rNLBTargetGroupAppTCP

    rNLBFullName:
      Description: The full name of the load balancer.
      Value:
        Fn::GetAtt: [rNetworkLoadBalancer, LoadBalancerFullName]
