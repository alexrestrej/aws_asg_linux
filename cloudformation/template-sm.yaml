              StringNotEquals:
                aws:PrincipalArn:
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_CLOUDFORMATION_DEPLOYMENT_ROLE" ]]
                  - !Join ["",["arn:aws:iam::", !Ref 'AWS::AccountId',":role/","BCO-SR-SecretCertificate-Operation"]]
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_CLOUDFORMATION_DEPLOYMENT_ROLE" ] ]
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_DATABASE_OPERATIONS_ROLE" ] ]
                  - !Join [ "", [ "arn:aws:iam::", !Ref 'AWS::AccountId',":root" ] ]
                  - !Ref pDBARole
                  - !Ref pCoesRole


  rSecretSchemaCNXDynatrace:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${pImportBase}-secretrds-CNXDYNA'
      Description:
        Fn::Sub: 'Secreto del usuario de conexion CNX de la BD YOUR_PROJECT_NAME para application monitoring service.'
      KmsKeyId:
        Fn::Join: [ "", [ "{{resolve:ssm:", Ref: pImportBase, "-kms:1}}" ] ]
      GenerateSecretString:
        SecretStringTemplate:
          !Join [ "", [ "{\"username\":\"", !Ref pUserDynatrace, "\"}" ] ]
        GenerateStringKey: "password"
        PasswordLength: 15
        ExcludeCharacters: '"@/\&'

  rSecretSchemaCNXDynatraceResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
