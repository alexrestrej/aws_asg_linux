# Stack removido. Se uso para la migracion DMS y ya no se requiere
---
AWSTemplateFormatVersion: 2010-09-09
Description: 'This template deploys a DMS secutiry Group, ReplicationInstance, and its Endpoint'
Parameters:

  pImportBase:
    Description: Cadena de proyecto para Parameter storage
    Type: String    

  pDmsSGCidrIp:
    Description: CidrIp Security Group DMS
    Type: String   

  pPrivateSubnet1:
    Description: VPC private subnet1
    Type: String  
  pPrivateSubnet2:
    Description: VPC private subnet2
    Type: String      
  #pAvailabilityZone:
  #  Description: Availability Zone
  #  Type: String  
  pDmsInstanceClass:
    Description: DMS instance Class
    Type: String
  pDmsReplInstanceStorage:
    Description: DMS Instance storage
    Type: String  
  pDmsSourceExtraConnAttributes:
    Description: Attributes Conn DMS
    Type: String  
  # Source Endpoint 
  pDmsSourceEngine:
    Description: DMS Instance Name
    Type: String  
  pDmsSourceDBName:
    Description: DMS Instance Name
    Type: String
  pDmsSourceUsername:
    Description: DMS Instance Name
    Type: String  
  pDmsSourcePassword:
    Description: DMS Instance Name
    Type: String 
  pDmsSourceDBServer:
    Description: DMS Instance Name
    Type: String 
  pDmsSourceDBPort:
    Description: DMS Instance Name
    Type: String 

# Target Endpoint
  pDmsTargetEngine:
    Description: DMS Instance Name
    Type: String
  pDmsTargetDBName:
    Description: DMS Instance Name
    Type: String      
  pDmsTargetUsername:
    Description: DMS Instance Name
    Type: String
  pDmsTargetPassword:
    Description: DMS Instance Name
    Type: String
  pDmsTargetDBServer:
    Description: DMS Instance Name
    Type: String 
  pDmsTargetDBPort:
    Description: DMS Instance Name
    Type: String 
  pEnvironment:
    Description: Ambiente donde se despliega.
    Type: String

Conditions:
  cenvintermedio:
    Fn::Or:
      - Fn::Equals: [Ref: pEnvironment, qa]
      - Fn::Equals: [Ref: pEnvironment, dev] 

  cenvPdn:
    Fn::Equals: [Ref: pEnvironment, pdn]

Resources:
### DMS
  rSecurityGroupDMS:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: DMS security group of db mentioned in the name.
      GroupName: 
        Fn::Join: ["-", [Ref: 'AWS::StackName', "dms"]]
      VpcId:
        Fn::ImportValue: DefaultVPCId
      SecurityGroupIngress:
      - IpProtocol: tcp #tcp
        FromPort: 443
        ToPort: 1500
        CidrIp: !Ref pDmsSGCidrIp #"YOUR_NETWORK_CIDR" # "YOUR_NETWORK_CIDR"
      Tags:
        - Key: Name
          Value: 
            Fn::Join: ["-", [Ref: 'AWS::StackName' , "sg"]]
        - Key: "organization:clasificacion-confidencialidad"
          Value: "restringida"
        - Key: "organization:clasificacion-integridad"
          Value: "impacto critico"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "impacto critico"
        - Key: "organization:dominio-informacion"
          Value: "no"
        - Key: "organization:datos-personales"
          Value: "no"
        - Key: "organization:cumplimiento"
          Value: "no"
