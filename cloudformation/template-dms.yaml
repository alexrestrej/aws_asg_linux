###

  rDMSReplicationSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupDescription: Subnets available for the DMS Replication Instance
      SubnetIds: 
        - Ref: pPrivateSubnet1
        - Ref: pPrivateSubnet2
      Tags:
        - Key: Name
          Value: 
            Fn::Join: ["-", [Ref: 'AWS::StackName' , "dms", "subnetgroup"]]
        - Key: "organization:clasificacion-confidencialidad"
          Value: "restringida"
        - Key: "organization:clasificacion-integridad"
          Value: "impacto critico"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "impacto critico"
        - Key: "organization:dominio-informacion"
          Value: "no"
        - Key: "organization:datos-personales"
          Value: "no"
        - Key: "organization:cumplimiento"
          Value: "no"


  rDMSReplicationInstance:
    Type: AWS::DMS::ReplicationInstance
    Properties:
#      AvailabilityZone: !Ref pAvailabilityZone
      ReplicationSubnetGroupIdentifier: !Ref rDMSReplicationSubnetGroup
      PubliclyAccessible: false
      EngineVersion: 3.4.6
      ReplicationInstanceIdentifier: 
        Fn::Join: ["-", [Ref: 'AWS::StackName' , "replication"]]
      ReplicationInstanceClass: 
        Ref: pDmsInstanceClass
      KmsKeyId: 
#        Fn::GetAtt: [ rKmsKey, Arn ]
        Fn::Join: ["", ["{{resolve:ssm:", Ref: pImportBase, "-kms:1}}"]]
      AllocatedStorage: 
        Ref: pDmsReplInstanceStorage
      VpcSecurityGroupIds: 
        - Ref: rSecurityGroupDMS
      Tags:
        - Key: Name
          Value: 
            Fn::Join: ["-", [Ref: 'AWS::StackName' , "DMSReplicationInstance"]]
        - Key: "organization:clasificacion-confidencialidad"
          Value: "restringida"
        - Key: "organization:clasificacion-integridad"
          Value: "impacto critico"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "impacto critico"
        - Key: "organization:dominio-informacion"
          Value: "no"
        - Key: "organization:datos-personales"
          Value: "no"
        - Key: "organization:cumplimiento"
          Value: "no"
      
  rSourceDatabase:
    Type: AWS::DMS::Endpoint
    DependsOn:
      - rDMSReplicationInstance
    Properties:
      EndpointIdentifier: 
        Fn::Join: ["-", [Ref: 'AWS::StackName', 'endpoint-source']]
      EngineName: 
        Ref: pDmsSourceEngine
      DatabaseName: 
        Ref: pDmsSourceDBName
      EndpointType: "source"
      Username: 
        Ref: pDmsSourceUsername
      Password: 
        Ref: pDmsSourcePassword
      ServerName: 
        Ref: pDmsSourceDBServer
      Port: 
        Ref: pDmsSourceDBPort
      ExtraConnectionAttributes: 
        Ref: pDmsSourceExtraConnAttributes
      Tags:
        - Key: Name
          Value: 
            Fn::Join: ["-", [Ref: 'AWS::StackName', "SourceDatabase"]]
        - Key: "organization:clasificacion-confidencialidad"
          Value: "restringida"
        - Key: "organization:clasificacion-integridad"
          Value: "impacto critico"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "impacto critico"
        - Key: "organization:dominio-informacion"
          Value: "no"
        - Key: "organization:datos-personales"
          Value: "no"
        - Key: "organization:cumplimiento"
          Value: "no"


##### TARGET
  rTargetDatabase:
    Type: AWS::DMS::Endpoint
    DependsOn:
      - rDMSReplicationInstance
    Properties:
      EndpointIdentifier: 
        Fn::Join: ["-", [Ref: 'AWS::StackName', 'endpoint-target']]
      EngineName: 
        Ref: pDmsTargetEngine
      DatabaseName: 
        Ref: pDmsTargetDBName
      EndpointType: "target"
      Username: 
        Ref: pDmsTargetUsername
      Password: 
        Ref: pDmsTargetPassword
      ServerName: 
        Ref: pDmsTargetDBServer
      Port: 
        Ref: pDmsTargetDBPort

      Tags:
        - Key: Name
          Value: 
            Fn::Join: ["-", [Ref: 'AWS::StackName' , "TargetDatabase"]]
        - Key: "organization:clasificacion-confidencialidad"
          Value: "restringida"
        - Key: "organization:clasificacion-integridad"
          Value: "impacto critico"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "impacto critico"
        - Key: "organization:dominio-informacion"
          Value: "no"
        - Key: "organization:datos-personales"
          Value: "no"
        - Key: "organization:cumplimiento"
          Value: "no"
    
  rReplicationYOUR_PROJECT_NAMEOWNER:
    Condition: cenvintermedio
    Type: AWS::DMS::ReplicationTask
    DependsOn: rDMSReplicationInstance
    Properties:      
      MigrationType: full-load-and-cdc
      ReplicationInstanceArn: !Ref rDMSReplicationInstance
      ReplicationTaskIdentifier: 
        Fn::Join: [ "-", [ Ref: pImportBase, "full-load-cdc", "YOUR_PROJECT_NAMEOWNER"]]
      SourceEndpointArn: !Ref rSourceDatabase
      TargetEndpointArn: !Ref rTargetDatabase
      TableMappings: 
        Fn::Sub:
          -
            '{
              "rules": [
                {
                  "rule-type": "transformation",
                  "rule-id": "1",
                  "rule-name": "1",
                  "rule-target": "schema",
                  "object-locator": {
                    "schema-name": "${SOURCE_SCHEMA}",
                    "table-name": "%"
                  },
                  "rule-action": "rename",
                  "value": "${TARGET_SCHEMA}",
                  "old-value": null
                },
                      {
                  "rule-type": "selection",
                  "rule-id": "2",
                  "rule-name": "2",
                  "object-locator": {
                    "schema-name": "${SOURCE_SCHEMA}",
                    "table-name": "DETECT_COMMON_CONFIGURATIONS%"
                  },
                  "rule-action": "exclude"

                },
                {
                  "rule-type": "selection",
                  "rule-id": "3",
                  "rule-name": "3",
                  "object-locator": {
                    "schema-name": "${SOURCE_SCHEMA}",
                    "table-name": "%"
                  },
                  "rule-action": "include",
                  "filters": []
                }
              ]
            }'
          - SOURCE_SCHEMA: "YOUR_PROJECT_NAME_OWNER"
            TARGET_SCHEMA: "YOUR_PROJECT_NAME_OWNER"
      ReplicationTaskSettings: 
        Fn::Sub:
          - '{
              "TargetMetadata": {
                  "TargetSchema": "${TARGET_SCHEMA}",
                  "SupportLobs": true,
                  "FullLobMode": true,
                  "LobChunkSize": 64,
                  "LimitedSizeLobMode": false,
                  "LobMaxSize": 0,
                  "InlineLobMaxSize": 0,
                  "LoadMaxFileSize": 0,
                  "ParallelLoadThreads": 0,
                  "ParallelLoadBufferSize": 0,
                  "BatchApplyEnabled": false,
                  "TaskRecoveryTableEnabled": false,
                  "ParallelLoadQueuesPerThread": 0,
                  "ParallelApplyThreads": 0,
                  "ParallelApplyBufferSize": 0,
                  "ParallelApplyQueuesPerThread": 0
              },
              "FullLoadSettings": {
                  "TargetTablePrepMode": "TRUNCATE_BEFORE_LOAD",
                  "CreatePkAfterFullLoad": false,
                  "StopTaskCachedChangesApplied": false,
                  "StopTaskCachedChangesNotApplied": false,
                  "MaxFullLoadSubTasks": 8,
                  "TransactionConsistencyTimeout": 600,
                  "CommitRate": 10000
              },
              "Logging": {
                  "EnableLogging": true,
                  "LogComponents": [
                      {
                          "Id": "TRANSFORMATION",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "SOURCE_UNLOAD",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "IO",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "TARGET_LOAD",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "PERFORMANCE",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "SOURCE_CAPTURE",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "SORTER",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "REST_SERVER",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "VALIDATOR_EXT",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "TARGET_APPLY",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "TASK_MANAGER",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "TABLES_MANAGER",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "METADATA_MANAGER",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "FILE_FACTORY",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "COMMON",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "ADDONS",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "DATA_STRUCTURE",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "COMMUNICATION",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      },
                      {
                          "Id": "FILE_TRANSFER",
                          "Severity": "LOGGER_SEVERITY_DEFAULT"
                      }
                  ]
              },
              "ControlTablesSettings": {
                  "historyTimeslotInMinutes": 5,
                  "ControlSchema": "",
                  "HistoryTimeslotInMinutes": 5,
                  "HistoryTableEnabled": false,
                  "SuspendedTablesTableEnabled": false,
                  "StatusTableEnabled": false
              },
              "StreamBufferSettings": {
                  "StreamBufferCount": 3,
                  "StreamBufferSizeInMB": 8,
                  "CtrlStreamBufferSizeInMB": 5
              },
              "ChangeProcessingDdlHandlingPolicy": {
                  "HandleSourceTableDropped": true,
                  "HandleSourceTableTruncated": true,
                  "HandleSourceTableAltered": true
              },
              "ErrorBehavior": {
                  "DataErrorPolicy": "LOG_ERROR",
                  "DataTruncationErrorPolicy": "LOG_ERROR",
                  "DataErrorEscalationPolicy": "SUSPEND_TABLE",
                  "DataErrorEscalationCount": 0,
                  "TableErrorPolicy": "SUSPEND_TABLE",
                  "TableErrorEscalationPolicy": "STOP_TASK",
                  "TableErrorEscalationCount": 0,
                  "RecoverableErrorCount": -1,
                  "RecoverableErrorInterval": 5,
                  "RecoverableErrorThrottling": true,
                  "RecoverableErrorThrottlingMax": 1800,
                  "ApplyErrorDeletePolicy": "IGNORE_RECORD",
                  "ApplyErrorInsertPolicy": "LOG_ERROR",
                  "ApplyErrorUpdatePolicy": "LOG_ERROR",
                  "ApplyErrorEscalationPolicy": "LOG_ERROR",
                  "ApplyErrorEscalationCount": 0,
                  "ApplyErrorFailOnTruncationDdl": false,
                  "FullLoadIgnoreConflicts": true,
                  "FailOnTransactionConsistencyBreached": false,
                  "FailOnNoTablesCaptured": false
              },
              "ChangeProcessingTuning": {
                  "BatchApplyPreserveTransaction": true,
                  "BatchApplyTimeoutMin": 1,
                  "BatchApplyTimeoutMax": 30,
                  "BatchApplyMemoryLimit": 500,
                  "BatchSplitSize": 0,
                  "MinTransactionSize": 1000,
                  "CommitTimeout": 1,
                  "MemoryLimitTotal": 1024,
                  "MemoryKeepTime": 60,
                  "StatementCacheSize": 50
              }
          }'
          - TARGET_SCHEMA: "CNXDMSAW"
      Tags:
        - Key: Name
          Value: 
            Fn::Join: ["-", [Ref: 'AWS::StackName' , "ReplicationYOUR_PROJECT_NAMEOWNER"]]
        - Key: "organization:clasificacion-confidencialidad"
          Value: "restringida"
        - Key: "organization:clasificacion-integridad"
          Value: "impacto critico"
        - Key: "organization:clasificacion-disponibilidad"
          Value: "impacto critico"
        - Key: "organization:dominio-informacion"
          Value: "no"
        - Key: "organization:datos-personales"
          Value: "no"
        - Key: "organization:cumplimiento"
          Value: "no"

