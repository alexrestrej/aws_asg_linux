  rIAMManagedPolicyforS3BackupRestore:
    #DependsOn:
    #- rS3RDS
    Type: 'AWS::IAM::ManagedPolicy'
    Properties:
      ManagedPolicyName: !Join [ "", [ !Ref 'AWS::StackName', "_iam_managed_policy" ] ]
      PolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Action:
          - 's3:ListBucket'
          - 's3:GetBucketLocation'
          Resource:
            Fn::Sub: arn:aws:s3:::${pRdsBucketName}
        - Effect: Allow
          Action:
          - 's3:GetObjectMetaData'
          - 's3:GetObject'
          - 's3:PutObject'
          - 's3:ListMultipartUploadParts'
          - 's3:AbortMultipartUpload'
          Resource: !Join [ "", [ "arn:aws:s3:::", !Ref pRdsBucketName, "/*" ] ]
      # Roles:
      #   - 'YOUR_APP_CODE-YOUR_PROJECT_NAME-dev-rds-role'

      #Rol para monitoreo de la BD
  rEnhancedMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/YOUR_GOVERNANCE_BOUNDARY_POLICY
      RoleName:
        Fn::Join: [ "-", [ { Ref: pImportBase }, "mig", "RDSEnhancedMonitoringRoleApp" ] ]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: ''
          Effect: Allow
          Principal:
            Service: monitoring.rds.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Path: "/"

  #Recurso RDS Aurora Postgres
  rDataBasesCluster:
    Type: 'AWS::RDS::DBCluster'
    Properties:
      EnableIAMDatabaseAuthentication: False
      CopyTagsToSnapshot: true
      DatabaseName:
        Ref: pDBName
      DBClusterIdentifier:
        Fn::Join: [ "-", [ { Ref: pImportBase }, "rds", "mig" ] ]
      VpcSecurityGroupIds:
      - Ref: pSSMDBSGTransversal
      - Ref: rDBSecurityGroups
      - Ref: pSGTrasnversal
      Engine:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - Engine
      EngineVersion:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - EngineVersion
      Port:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - port
      KmsKeyId:
        Fn::Join: [ "", [ "{{resolve:ssm:", { Ref: pImportBase }, "-kms}}" ] ]
      EnableCloudwatchLogsExports:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - EnableCloudwatchLogsExports
      MasterUsername:
        Fn::Join: [ '', [ '{{resolve:secretsmanager:', { Ref: rSecretAdminRDSMig }, ':SecretString:username}}' ] ]
      MasterUserPassword:
        Fn::Join: [ '', [ '{{resolve:secretsmanager:', { Ref: rSecretAdminRDSMig }, ':SecretString:password}}' ] ]
      PreferredBackupWindow:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - PreferredBackupWindow
      DBClusterParameterGroupName:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - ParameterGroupCluster
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      PreferredMaintenanceWindow:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - PreferredMaintenanceWindow
      DBSubnetGroupName:
        Fn::Sub: '${pEnvironment}-db-subnets2'
      DeletionProtection:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - DeletionProtection
      DeleteAutomatedBackups: true
      BackupRetentionPeriod:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - BackupRetentionPeriod
      MonitoringRoleArn: !GetAtt rEnhancedMonitoringRole.Arn
      MonitoringInterval: 60
      AssociatedRoles:
        Fn::If:
        - cNotDev
        - - FeatureName: s3Export
            RoleArn:
              Fn::GetAtt: rIAMRoleForRDS.Arn
        - Ref: "AWS::NoValue"
      Tags:
      - Key: organization:clasificacion-confidencialidad
        Value: "restringida"
      - Key: organization:clasificacion-integridad
        Value: "impacto critico"
      - Key: organization:clasificacion-disponibilidad
        Value: "impacto critico"
      - Key: organization:dominio-informacion
        Value: "no"
      - Key: organization:datos-personales
        Value: "no"
      - Key: organization:cumplimiento
        Value: "bia"
      - Key: organization:bkmensual
        Value: "rds"
      - Key: organization:bkdiario
        Value: "rds"
      - Key: instance:scheduler
        Value: !Ref pinstanceScheduler
    DeletionPolicy: Snapshot

  rDataBasesInstancer:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      CACertificateIdentifier:
        Ref: pSSLcertificate
      DBClusterIdentifier:
        Ref: rDataBasesCluster
      DBInstanceIdentifier:
        Fn::Join: [ "-", [ { Ref: pImportBase }, "rds", "mig", "r", "instance" ] ]
      DBSubnetGroupName:
        Fn::Sub: '${pEnvironment}-db-subnets2'
      DBInstanceClass:
        Ref: pRdsClassInstance
      Engine:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - Engine
      DBParameterGroupName:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - ParameterGroupInstance
      LicenseModel:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - licenseModel
      MultiAZ:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - MultiAZ
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: true
      PreferredMaintenanceWindow:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - PreferredMaintenanceWindow
      EnablePerformanceInsights: true
      Tags:
      - Key: organization:clasificacion-confidencialidad
        Value: "restringida"
      - Key: organization:clasificacion-integridad
        Value: "impacto critico"
      - Key: organization:clasificacion-disponibilidad
        Value: "impacto critico"
      - Key: organization:dominio-informacion
        Value: "no"
      - Key: organization:datos-personales
        Value: "no"
      - Key: organization:cumplimiento
        Value: "bia"
      - Key: organization:bkmensual
        Value: "rds"
      - Key: organization:bkdiario
        Value: "rds"

  rDataBasesInstanceW:
    Type: 'AWS::RDS::DBInstance'
    DependsOn: rDataBasesInstancer
    Properties:
      CACertificateIdentifier:
        Ref: pSSLcertificate
      DBClusterIdentifier:
        Ref: rDataBasesCluster
      DBInstanceIdentifier:
        Fn::Join: [ "-", [ { Ref: pImportBase }, "rds", "mig", "w", "instance" ] ]
      DBSubnetGroupName:
        Fn::Sub: '${pEnvironment}-db-subnets2'
      DBInstanceClass:
        Ref: pRdsClassInstance
      MultiAZ:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - MultiAZ
      Engine:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - Engine
      DBParameterGroupName:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - ParameterGroupInstance
      LicenseModel:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - licenseModel
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: true
      PreferredMaintenanceWindow:
        Fn::FindInMap:
        - Ref: pDataBase
        - Ref: pEnvironment
        - PreferredMaintenanceWindow
      EnablePerformanceInsights: true
      Tags:
      - Key: organization:clasificacion-confidencialidad
        Value: "restringida"
      - Key: organization:clasificacion-integridad
        Value: "impacto critico"
      - Key: organization:clasificacion-disponibilidad
        Value: "impacto critico"
      - Key: organization:dominio-informacion
        Value: "no"
      - Key: organization:datos-personales
        Value: "no"
      - Key: organization:cumplimiento
        Value: "bia"
      - Key: organization:bkmensual
        Value: "rds"
      - Key: organization:bkdiario
        Value: "rds"

  rSecretAdminRDSMig:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name:
        Fn::Sub: '${pImportBase}-mig-secretrds-admind'
      Description:
        Fn::Sub: 'Secreto del usuario administrador de la base de datos ${pImportBase}-mig.'
      KmsKeyId: '{{resolve:ssm:YOUR_RDS_ADMIN_KMS_PARAMETER}}'
      GenerateSecretString:
        SecretStringTemplate: '{"username": "YOUR_DATABASE_ADMIN_USER"}'
        GenerateStringKey: "password"
        PasswordLength: 15
        ExcludeCharacters: '"@/\'

  rSecretAdminRDSMigResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    DependsOn: rSecretAdminRDSMig
    Properties:
      SecretId: !Ref rSecretAdminRDSMig
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: "Deny"
            Principal:
              AWS: "*"
            Action:
              - "secretsmanager:GetSecretValue"
            Resource: "*"
            Condition:
              StringNotEquals:
                aws:PrincipalArn:
                  - !Join [ "",[ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_CLOUDFORMATION_DEPLOYMENT_ROLE" ] ]
                  - !Join [ "",[ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/","BCO-SR-SecretCertificate-Operation" ] ]
                  - !Join [ "",[ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_CLOUDFORMATION_DEPLOYMENT_ROLE" ] ]
                  - !Join [ "",[ "arn:aws:iam::", !Ref 'AWS::AccountId',":root" ] ]
                  - !Join [ "",[ "arn:aws:iam::", !Ref 'AWS::AccountId',":role/YOUR_DATABASE_OPERATIONS_ROLE" ] ]
                  - !Ref pDBARole
                  - !Ref pCoesRole
